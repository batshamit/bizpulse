# BizPulse stack — portfolio reference deployment.
#
# This compose file is the canonical "clean GPU box" deployment. It is NOT what
# runs on the shared dev server (where Docker data-root is on a constrained
# partition we don't own — services run as host processes there instead).
#
# Tested target: a single-host machine with NVIDIA Container Toolkit and at
# least 32 GB VRAM (one V100-class GPU) for Qwen2.5-14B-Instruct. Bump
# tensor-parallel and switch to a larger model on a multi-GPU box.

name: bizpulse

networks:
  bizpulse-net:
    driver: bridge

volumes:
  qdrant_storage: { name: bizpulse_qdrant_storage }
  pg_data:        { name: bizpulse_pg_data }
  hf_cache_llm:   { name: bizpulse_hf_cache_llm }
  hf_cache_embed: { name: bizpulse_hf_cache_embed }
  hf_cache_rerank:{ name: bizpulse_hf_cache_rerank }

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: bizpulse-qdrant
    restart: unless-stopped
    networks: [bizpulse-net]
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]   # qdrant has /healthz; CMD-SHELL avoids needing curl in image
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: bizpulse-postgres
    restart: unless-stopped
    networks: [bizpulse-net]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-bizpulse}
      POSTGRES_USER:     ${POSTGRES_USER:-bizpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bizpulse} -d $${POSTGRES_DB:-bizpulse}"]
      interval: 15s
      timeout: 5s
      retries: 10

  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    container_name: bizpulse-tei-embed
    restart: unless-stopped
    networks: [bizpulse-net]
    ports:
      - "8081:80"
    environment:
      MODEL_ID: BAAI/bge-large-en-v1.5
      HF_HUB_ENABLE_HF_TRANSFER: "1"
    volumes:
      - hf_cache_embed:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 10

  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    container_name: bizpulse-tei-rerank
    restart: unless-stopped
    networks: [bizpulse-net]
    ports:
      - "8082:80"
    environment:
      MODEL_ID: BAAI/bge-reranker-v2-m3
      HF_HUB_ENABLE_HF_TRANSFER: "1"
    volumes:
      - hf_cache_rerank:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 10

  vllm:
    image: vllm/vllm-openai:v0.6.4
    container_name: bizpulse-vllm
    restart: unless-stopped
    networks: [bizpulse-net]
    ports:
      - "8800:8000"
    environment:
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - hf_cache_llm:/root/.cache/huggingface
    command: >-
      --model Qwen/Qwen2.5-14B-Instruct
      --max-model-len 16384
      --gpu-memory-utilization 0.85
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --dtype float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 60s
      timeout: 10s
      retries: 30
      start_period: 600s
    depends_on:
      qdrant:
        condition: service_healthy
