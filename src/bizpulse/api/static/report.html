<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BizPulse — Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui/css/app.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="/ui/js/app.js"></script>
</head>
<body>

<nav class="bzp-nav" x-data="topNav()">
  <div class="bzp-nav-inner">
    <a href="/ui/dashboard.html" class="bzp-brand" style="text-decoration:none; color:var(--bzp-ink);">BizPulse<span class="dot">.</span></a>
    <div class="bzp-nav-links" style="display:flex; align-items:center;">
      <a href="/ui/dashboard.html">Dashboard</a>
      <a href="/ui/new-report.html">New report</a>
      <a href="/ui/history.html">History</a>
      <a href="/ui/about.html">About</a>
      <span x-show="tenant" style="color:var(--bzp-ink-faint); margin-left:1.5rem; font-size:0.85rem;" x-text="tenant?.name"></span>
      <a href="#" @click.prevent="logout()" style="margin-left:0.8rem; color:var(--bzp-ink-soft);">Sign out</a>
    </div>
  </div>
</nav>

<div class="bzp-container" x-data="reportPage()">

  <a href="/ui/history.html" style="font-size:0.85rem; color:var(--bzp-ink-soft); display:inline-block; margin-bottom:0.6rem;">← Back to history</a>

  <template x-if="busy">
    <div class="bzp-empty">Loading run…</div>
  </template>

  <template x-if="!busy && error">
    <div class="bzp-card" style="background:var(--bzp-danger-soft); color:var(--bzp-danger);" x-text="error"></div>
  </template>

  <template x-if="!busy && run">
    <div>
      <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:1rem;">
        <div>
          <h1 class="bzp-page-title">Analysis report</h1>
          <div class="bzp-page-subtitle">
            <span x-text="business?.url || ''"></span>
            <template x-if="business?.industry"> · <span x-text="business.industry"></span></template>
          </div>
        </div>
        <div style="display:flex; gap:0.5rem; margin-bottom:0.5rem;">
          <button @click="downloadPdf()" class="bzp-btn bzp-btn-primary" :disabled="!run?.final_output">
            📄 Download PDF
          </button>
          <button @click="downloadReport()" class="bzp-btn bzp-btn-ghost" :disabled="!run?.final_output">
            📥 Markdown
          </button>
        </div>
      </div>

      <div class="bzp-grid-stats">
        <div class="bzp-stat">
          <div class="bzp-stat-label">Status</div>
          <div class="bzp-stat-value" style="font-size:1.1rem;"><span x-html="statusPill(run.status)"></span></div>
        </div>
        <div class="bzp-stat">
          <div class="bzp-stat-label">Started</div>
          <div class="bzp-stat-value" style="font-size:1.1rem;" x-text="fmtTime(run.started_at)"></div>
        </div>
        <div class="bzp-stat">
          <div class="bzp-stat-label">Finished</div>
          <div class="bzp-stat-value" style="font-size:1.1rem;" x-text="fmtTime(run.finished_at) || '—'"></div>
        </div>
        <div class="bzp-stat">
          <div class="bzp-stat-label">Report Cost</div>
          <div class="bzp-stat-value" style="font-size:1.1rem;" x-text="fmtCurrency(run.total_cost_usd)"></div>
        </div>
        <div class="bzp-stat">
          <div class="bzp-stat-label">Run id</div>
          <div class="bzp-stat-value" style="font-size:0.95rem; font-family:'JetBrains Mono',monospace;" x-text="run.id?.slice(0,8) + '…'"></div>
        </div>
      </div>

      <!-- Tabs -->
      <div style="display:flex; gap:0.4rem; border-bottom:1px solid var(--bzp-border); margin-bottom:1.5rem;">
        <template x-for="tab in ['strategy', 'compliance', 'agents', 'raw']" :key="tab">
          <button @click="activeTab=tab"
                  :style="activeTab===tab
                    ? 'border-bottom:2px solid var(--bzp-accent); color:var(--bzp-accent); font-weight:500;'
                    : 'color:var(--bzp-ink-soft);'"
                  style="background:none; border:none; padding:0.7rem 1rem; cursor:pointer; font-size:0.95rem;"
                  x-text="tab.charAt(0).toUpperCase() + tab.slice(1)"></button>
        </template>
      </div>

      <!-- Strategy tab -->
      <div x-show="activeTab === 'strategy'">
        <template x-if="!run.final_output">
          <div class="bzp-card bzp-empty">
            <template x-if="run.status === 'failed'">
              <div>
                <div style="font-size:1.1rem; color:var(--bzp-danger); margin-bottom:0.6rem;">
                  Analysis failed
                </div>
                <div x-show="run.error" x-text="run.error" style="font-size:0.85rem; color:var(--bzp-ink-soft); background:var(--bzp-danger-soft); padding:0.8rem; border-radius:var(--bzp-radius); margin-bottom:1rem; text-align:left; font-family:monospace; word-break:break-word;"></div>
                <div style="display:flex; gap:0.6rem; justify-content:center;">
                  <button @click="retry()" :disabled="retrying" class="bzp-btn bzp-btn-primary">
                    <span x-show="!retrying">↻ Retry analysis</span>
                    <span x-show="retrying">Retrying…</span>
                  </button>
                  <a href="/ui/new-report.html" class="bzp-btn bzp-btn-ghost">New report</a>
                </div>
              </div>
            </template>
            <template x-if="run.status !== 'failed'">
              <div>
                <div style="font-size:1.05rem; margin-bottom:0.5rem;">Strategy not yet available</div>
                <div>This run is in <strong x-text="run.status"></strong>. The Council of LLMs is still processing — refresh in a moment.</div>
                <button @click="init()" class="bzp-btn bzp-btn-ghost" style="margin-top:1rem;">Refresh</button>
              </div>
            </template>
          </div>
        </template>

        <template x-if="run.final_output">
          <div class="bzp-card">
            <h2>Executive summary</h2>
            <p x-text="run.final_output.summary" style="line-height:1.65; color:var(--bzp-ink-soft); margin:1rem 0;"></p>

            <div x-show="run.final_output.inclusivity_metrics" style="margin-top:2rem;">
              <h3>Inclusivity Scorecard (4 L's)</h3>
              <div class="bzp-llll-grid" style="margin-top:1rem;">
                <template x-for="key in [['last','LAST customer'], ['least','LEAST-considered'], ['lost','LOST customers'], ['lowest','LOWEST budget']]" :key="key[0]">
                  <div class="bzp-llll-card" style="padding:0.6rem 0.8rem;">
                    <div class="bzp-llll-name" style="font-size:0.75rem;" x-text="key[1]"></div>
                    <div class="bzp-llll-value" style="font-size:1.1rem; margin-top:0.2rem;" x-text="((run.final_output.inclusivity_metrics[key[0]] || 0)*100).toFixed(0) + '%'"></div>
                    <div class="bzp-llll-bar"><span :style="`width: ${(run.final_output.inclusivity_metrics[key[0]] || 0)*100}%`"></span ></div>
                  </div>
                </template>
              </div>
              <p x-text="run.final_output.inclusivity_metrics?.narrative" style="font-size:0.88rem; color:var(--bzp-ink-soft); font-style:italic; margin-top:0.8rem;"></p>
            </div>

            <hr class="bzp-divider">

            <h3>Recommendations</h3>
            <template x-for="(r, i) in (run.final_output.recommendations || [])" :key="i">
              <!-- ... recommendation card (unchanged) ... -->
              <div style="border:1px solid var(--bzp-border); border-radius:var(--bzp-radius); padding:1rem 1.2rem; margin:0.8rem 0;">
                <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.5rem;">
                  <span class="bzp-pill bzp-pill-accent" x-text="r.priority"></span>
                  <span class="bzp-pill bzp-pill-neutral" x-text="r.channel"></span>
                  <span style="color:var(--bzp-ink-faint); font-size:0.78rem;" x-text="`conf ${(r.confidence*100).toFixed(0)}%`"></span >
                </div>
                <div style="font-weight:500; margin-bottom:0.4rem;" x-text="r.action"></div>
                <div style="color:var(--bzp-ink-soft); font-size:0.9rem;" x-text="r.rationale"></div>
                <div x-show="r.compliance_flags?.length" style="margin-top:0.5rem;">
                  <template x-for="f in (r.compliance_flags || [])" :key="f">
                    <span class="bzp-pill bzp-pill-warning" style="margin-right:0.3rem;" x-text="f"></span>
                  </template>
                </div>

                <!-- Chat section -->
                <div style="margin-top:1rem; border-top:1px solid var(--bzp-border); padding-top:0.8rem;"
                     x-data="{ 
                       open: false, msg: '', reply: '', busy: false,
                       async chat() {
                         this.busy = true;
                         try {
                           const res = await bzpFetch(`/v1/runs/${run.id}/chat`, {
                             method: 'POST',
                             body: JSON.stringify({ recommendation_index: i, message: this.msg })
                           });
                           this.reply = res.reply;
                           this.msg = '';
                         } catch (e) { bzpToast(e.message); }
                         finally { this.busy = false; }
                       }
                     }">
                  <button @click="open = !open" class="bzp-btn bzp-btn-ghost" style="font-size:0.8rem; padding:0.3rem 0.6rem;">
                    <span x-show="!open">💬 Chat about implementation</span>
                    <span x-show="open">Close chat</span>
                  </button>
                  <div x-show="open" style="margin-top:0.8rem;">
                    <template x-if="reply">
                       <div style="background:var(--bzp-cream); padding:0.8rem; border-radius:var(--bzp-radius); margin-bottom:0.8rem; font-size:0.9rem; border:1px solid var(--bzp-border); white-space:pre-wrap;" x-text="reply"></div>
                    </template>
                    <div style="display:flex; gap:0.5rem;">
                      <input x-model="msg" placeholder="Ask a question..." class="bzp-input" style="flex:1; font-size:0.85rem;" @keyup.enter="chat()">
                      <button @click="chat()" :disabled="busy || !msg.trim()" class="bzp-btn bzp-btn-primary" style="font-size:0.85rem;">
                        <span x-show="!busy">Send</span>
                        <span x-show="busy">...</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </template>

            <div x-show="run.final_output.detailed_channel_strategies?.length" style="margin-top:2rem;">
              <hr class="bzp-divider">
              <h3>Detailed Channel Strategies</h3>
              <template x-for="ds in run.final_output.detailed_channel_strategies" :key="ds.channel">
                <div style="margin:1rem 0; padding-bottom:1rem; border-bottom:1px solid var(--bzp-border-faint);">
                  <div style="font-weight:600; font-size:1.05rem; margin-bottom:0.4rem;" x-text="ds.channel.toUpperCase().replace('_', ' ')"></div>
                  <div style="line-height:1.6; color:var(--bzp-ink-soft); font-size:0.95rem; white-space:pre-wrap;" x-text="ds.strategy_details"></div>
                  <div x-show="ds.key_metrics?.length" style="margin-top:0.6rem;">
                    <span style="font-size:0.8rem; font-weight:500; color:var(--bzp-ink-faint);">Key Metrics:</span>
                    <template x-for="m in ds.key_metrics" :key="m">
                      <span class="bzp-pill bzp-pill-neutral" style="margin-left:0.3rem;" x-text="m"></span>
                    </template>
                  </div>
                </div>
              </template>
            </div>

            <div x-show="run.final_output.benefit_report" style="margin-top:2rem; background:var(--bzp-accent-soft); padding:1.2rem; border-radius:var(--bzp-radius);">
              <h3 style="color:var(--bzp-accent); margin-top:0;">Business Benefit Report</h3>
              <p x-text="run.final_output.benefit_report" style="line-height:1.65; color:var(--bzp-ink-soft); margin:0.5rem 0 0; white-space:pre-wrap;"></p>
            </div>

            <div x-show="run.final_output.competitive_landscape?.competitors?.length" style="margin-top:2rem;">
              <hr class="bzp-divider">
              <h3>Competitive Intel</h3>
              <template x-for="c in run.final_output.competitive_landscape.competitors" :key="c.name">
                <div style="margin:0.8rem 0; font-size:0.9rem;">
                  <strong x-text="c.name"></strong> · <a :href="c.url" target="_blank" style="color:var(--bzp-accent);" x-text="c.url"></a>
                  <div x-show="c.linkedin_url" style="margin-top:0.2rem;">
                    <a :href="c.linkedin_url" target="_blank" style="color:var(--bzp-ink-soft); font-size:0.8rem; display:inline-flex; align-items:center; gap:0.3rem;">
                      <svg style="width:14px; height:14px;" viewBox="0 0 24 24"><path fill="currentColor" d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
                      LinkedIn Company Page
                    </a>
                  </div>
                </div>
              </template>
            </div>

          </div>
        </template>
      </div>

      <!-- Compliance tab -->
      <div x-show="activeTab === 'compliance'">
        <template x-if="!run.final_output?.compliance_report">
          <div class="bzp-card bzp-empty">Compliance audit will appear once the analysis completes.</div>
        </template>
        <template x-if="run.final_output?.compliance_report">
          <div class="bzp-card">
            <h2>Compliance audit</h2>
            <div style="color:var(--bzp-ink-soft);">
              <span x-text="run.final_output.compliance_report.country"></span>
              <template x-if="run.final_output.compliance_report.state"> · <span x-text="run.final_output.compliance_report.state"></span></template>
              · Overall score <strong x-text="(run.final_output.compliance_report.overall_compliance_score * 100).toFixed(0) + '%'"></strong>
            </div>

            <div style="background:var(--bzp-cream); border:1px solid var(--bzp-border); border-radius:var(--bzp-radius); padding:0.9rem 1.1rem; margin-bottom:1rem; font-size:0.85rem; color:var(--bzp-ink-soft);">
              <strong style="color:var(--bzp-ink);">The 4 L's — Customer-Inclusivity Scorecard</strong><br>
              Measures how well this strategy serves the typically-overlooked end of the customer spectrum.
              Higher score = strategy actively includes the under-served.
            </div>
            <div class="bzp-llll-grid">
              <template x-for="key in [['last','LAST customer', 'late adopters · newcomers · waitlist'], ['least','LEAST-considered', 'minorities · accessibility · regional · rural'], ['lost','LOST customers', 'churned · cart-abandoners · dormant'], ['lowest','LOWEST budget', 'price-sensitive · EMI · freemium · students']]" :key="key[0]">
                <div class="bzp-llll-card">
                  <div class="bzp-llll-letter" x-text="key[0].charAt(0).toUpperCase()"></div>
                  <div class="bzp-llll-name" x-text="key[1]"></div>
                  <div class="bzp-llll-value" x-text="((run.final_output.compliance_report.metrics[key[0]] || 0)*100).toFixed(0) + '%'"></div>
                  <div class="bzp-llll-bar"><span :style="`width: ${(run.final_output.compliance_report.metrics[key[0]] || 0)*100}%`"></span ></div>
                  <div style="font-size:0.65rem; color:var(--bzp-ink-faint); margin-top:0.3rem;" x-text="key[2]"></div>
                </div>
              </template>
            </div>

            <p x-text="run.final_output.compliance_report.metrics.narrative" style="font-style:italic; color:var(--bzp-ink-soft); margin-bottom:1.5rem;"></p>

            <h3>Flags</h3>
            <template x-for="f in run.final_output.compliance_report.flags" :key="f.policy_slug + f.issue">
              <div style="border:1px solid var(--bzp-border); border-radius:var(--bzp-radius); padding:1rem 1.2rem; margin:0.8rem 0;">
                <div>
                  <span class="bzp-pill" :class="`bzp-pill-${f.severity === 'critical' || f.severity === 'violation' ? 'danger' : (f.severity === 'warning' ? 'warning' : 'neutral')}`" x-text="f.severity"></span >
                  <span style="color:var(--bzp-ink-soft); font-family:monospace; font-size:0.8rem; margin-left:0.4rem;" x-text="f.policy_slug"></span>
                </div>
                <div style="margin:0.6rem 0;" x-text="f.issue"></div>
                <div x-show="f.fix" style="color:var(--bzp-success); font-size:0.9rem;">
                  <strong>Fix:</strong> <span x-text="f.fix"></span>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- Agents tab -->
      <div x-show="activeTab === 'agents'">
        <div class="bzp-card">
          <h2>Agent traces</h2>
          <div style="color:var(--bzp-ink-soft); font-size:0.88rem; margin-bottom:1rem;">
            Per-node execution log from the LangGraph run. Each analyst, the strategist, and the compliance checker emit one trace.
          </div>
          <template x-if="!agentTraces().length">
            <div class="bzp-empty">No agent traces recorded for this run.</div>
          </template>
          <template x-for="t in agentTraces()" :key="t.id || t.agent">
            <div style="border:1px solid var(--bzp-border); border-radius:var(--bzp-radius); padding:0.9rem 1.1rem; margin:0.6rem 0;">
              <div style="display:flex; gap:0.5rem; align-items:center;">
                <strong x-text="t.agent" style="font-family:'JetBrains Mono', monospace; font-size:0.9rem;"></strong>
                <span class="bzp-pill" :class="`bzp-pill-${t.status === 'ok' ? 'success' : (t.status === 'retry' ? 'warning' : 'danger')}`" x-text="t.status"></span >
                <span x-show="t.retries > 0" class="bzp-pill bzp-pill-warning" x-text="`${t.retries} retr${t.retries===1?'y':'ies'}`"></span >
              </div>
              <div style="font-size:0.78rem; color:var(--bzp-ink-faint); margin-top:0.4rem;">
                <span x-text="t.started_at ? fmtTime(t.started_at) : ''"></span>
                <span x-show="t.duration_ms != null"> · <span x-text="(t.duration_ms || 0).toFixed(0) + 'ms'"></span></span>
              </div>
              <div x-show="t.error" style="color:var(--bzp-danger); margin-top:0.5rem; font-size:0.85rem; font-family:monospace; word-break:break-word;" x-text="t.error"></div>
            </div>
          </template>
        </div>
      </div>

      <!-- Raw JSON tab -->
      <div x-show="activeTab === 'raw'">
        <div class="bzp-card">
          <h2>Raw RunRecord JSON</h2>
          <div style="color:var(--bzp-ink-soft); font-size:0.85rem; margin-bottom:1rem;">For debugging or downstream tooling.</div>
          <pre class="bzp-code" x-text="JSON.stringify(run, null, 2)"></pre>
        </div>
      </div>

    </div>
  </template>

</div>
</body>
</html>
