<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>BizPulse — Admin</title>
  <link rel='preconnect' href='https://fonts.googleapis.com'>
  <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
  <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap' rel='stylesheet'>
  <link rel='stylesheet' href='/ui/css/app.css'>
  <script defer src='https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js'></script>
  <script src='/ui/js/app.js?v=1.0.1'></script>
</head>
<body>

<nav class='bzp-nav'>
  <div class='bzp-nav-inner'>
    <a href='/ui/admin.html' class='bzp-brand' style='text-decoration:none; color:var(--bzp-ink);'>
      BizPulse<span class='dot'>.</span>
      <span style='font-family:"Inter"; font-size:0.85rem; color:var(--bzp-accent); font-weight:500; margin-left:0.5rem; letter-spacing:0.04em; text-transform:uppercase;'>admin</span>
    </a>
    <div class='bzp-nav-links'>
      <a href='/ui/admin.html' class='active'>Admin</a>
      <a href='#' @click.prevent='document.dispatchEvent(new Event("admin:signout"))' x-show='localStorage.getItem("bizpulse.admin_key")' style='color:var(--bzp-ink-soft);'>Sign out</a>
    </div>
  </div>
</nav>

<div class='bzp-container' x-data='adminPage()' @admin:signout.window='signOut()'>

  <!-- LOGIN MODE -->
  <template x-if='!authed'>
    <div style='max-width:480px; margin:5rem auto;'>
      <h1 class='bzp-page-title'>Operator sign-in</h1>
      <div class='bzp-page-subtitle'>Enter your <code>BIZPULSE_ADMIN_KEY</code>.</div>
      <div class='bzp-card'>
        <form @submit.prevent='loginAdmin()' autocomplete='off'>
          <label class='bzp-label' for='adminKey'>Admin key</label>
          <input id='adminKey' x-model='adminKey' type='password' placeholder='...' class='bzp-input' required autofocus>

          <template x-if='requiresTotp'>
            <div style='margin-top:1rem;'>
              <label class='bzp-label' for='totp'>TOTP code</label>
              <input id='totp' x-model='totp' type='text' inputmode='numeric' maxlength='6' pattern='[0-9]{6}' placeholder='123456' class='bzp-input' required>
            </div>
          </template>

          <button :disabled='busy' class='bzp-btn bzp-btn-primary' style='width:100%; margin-top:1.25rem; justify-content:center;'>
            <span x-show='!busy'>Sign in →</span>
            <span x-show='busy'>Verifying…</span>
          </button>
          <div x-show='error' x-text='error' style='color:var(--bzp-danger); font-size:0.88rem; margin-top:0.9rem; text-align:center;'></div>
        </form>
      </div>
    </div>
  </template>

  <!-- AUTHED MODE -->
  <template x-if='authed'>
    <div>
      <h1 class='bzp-page-title'>Admin</h1>
      <div class='bzp-page-subtitle'>Operator view across every tenant.</div>

      <div class='bzp-grid-stats'>
        <div class='bzp-stat'>
          <div class='bzp-stat-label'>Tenants</div>
          <div class='bzp-stat-value' x-text='Array.isArray(tenants) ? tenants.length : 0'></div>
        </div>
        <div class='bzp-stat'>
          <div class='bzp-stat-label'>Active (24h)</div>
          <div class='bzp-stat-value' x-text='Array.isArray(tenants) ? tenants.filter(t => t && t.runs_today > 0).length : 0'></div>
        </div>
        <div class='bzp-stat'>
          <div class='bzp-stat-label'>Total cost</div>
          <div class='bzp-stat-value' x-text="Array.isArray(tenants) ? '\$' + tenants.reduce((s,t)=> s+(t ? (t.total_cost_usd||0) : 0), 0).toFixed(4) : '$0.0000'"></div>
        </div>
      </div>

      <!-- tabs -->
      <div style='display:flex; gap:0.4rem; border-bottom:1px solid var(--bzp-border); margin-bottom:1.5rem;'>
        <template x-for="t in ['tenants', 'system', 'resources', 'metadata', 'audit', 'cleanup']" :key='t'>
          <button @click='activeTab=t'
                  :class="activeTab === t ? 'bzp-admin-tab-btn active' : 'bzp-admin-tab-btn'"
                  x-text='t'></button>
        </template>
      </div>

      <!-- SYSTEM tab -->
      <div x-show="activeTab === 'system'" class='bzp-card'>
        <h3 style='margin-bottom:1rem;'>Background Services</h3>
        <div class='bzp-grid-stats' style='grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1rem;'>
          <template x-for='s in systemStatus' :key='s.name'>
            <div class='bzp-stat' style='padding:1rem;'>
              <div style='display:flex; justify-content:space-between; align-items:center;'>
                <div class='bzp-stat-label' style='margin:0; font-size:0.8rem;' x-text='s.name.toUpperCase()'></div>
                <span class='bzp-pill' :class='s.healthy ? "bzp-pill-success" : "bzp-pill-danger"' x-text='s.healthy ? "OK" : "DOWN"'></span>
              </div>
              <div style='margin-top:0.5rem; font-size:0.85rem; color:var(--bzp-ink-soft);' x-text='s.details || "..."'></div>
            </div>
          </template>
        </div>
        <div style='margin-top:1.5rem; font-size:0.85rem; color:var(--bzp-ink-faint); font-style:italic;'>
          * Status updated every 30 seconds. Services marked DOWN may require manual restart via CLI if GPUs are full.
        </div>
      </div>

      <!-- TENANTS tab -->
      <div x-show="activeTab === 'tenants'" class='bzp-card' style='padding:0;'>
        <!-- Tenant Sub-tabs: Actual vs Test -->
        <div style='display:flex; gap:0.25rem; padding:1.25rem 1.5rem 0 1.5rem; border-bottom:1px solid var(--bzp-border); background:var(--bzp-border-soft); border-top-left-radius:var(--bzp-radius-lg); border-top-right-radius:var(--bzp-radius-lg);'>
          <button @click="tenantSubTab = 'actual'; selectedTenantIds = []"
                  :class="tenantSubTab === 'actual' ? 'bzp-tenant-subtab-btn active' : 'bzp-tenant-subtab-btn'"
                  x-text="'Actual Tenants (' + (Array.isArray(tenants) ? tenants.filter(t => t && !t.is_test).length : 0) + ')'">
          </button>
          <button @click="tenantSubTab = 'test'; selectedTenantIds = []"
                  :class="tenantSubTab === 'test' ? 'bzp-tenant-subtab-btn active' : 'bzp-tenant-subtab-btn'"
                  x-text="'Test Tenants (' + (Array.isArray(tenants) ? tenants.filter(t => t && t.is_test).length : 0) + ')'">
          </button>
        </div>

        <div style='display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:1.25rem 1.5rem; border-bottom:1px solid var(--bzp-border);'>
          <div style='flex:1; max-width:400px;'>
            <input type='text' x-model='searchQuery' placeholder='Search by name, slug, or API key...' class='bzp-input' style='padding:0.5rem 0.8rem;'>
          </div>
          <div style='display:flex; gap:0.5rem;'>
            <button @click.stop='editSelected()' :disabled='selectedTenantIds.length === 0' class='bzp-btn bzp-btn-ghost' style='color:var(--bzp-accent); border-color:var(--bzp-accent-soft); padding:0.5rem 1rem;' x-text="'Edit Selected (' + selectedTenantIds.length + ')'"></button>
            <button @click.stop='editAll()' :disabled='filteredTenants().length === 0' class='bzp-btn bzp-btn-ghost' style='color:var(--bzp-accent); border-color:var(--bzp-accent-soft); padding:0.5rem 1rem;'>Edit All</button>
            <button @click='deleteSelected()' :disabled='selectedTenantIds.length === 0' class='bzp-btn bzp-btn-ghost' style='color:var(--bzp-danger); border-color:var(--bzp-danger-soft); padding:0.5rem 1rem;' x-text="'Delete Selected (' + selectedTenantIds.length + ')'"></button>
            <button @click='deleteAll()' :disabled='filteredTenants().length === 0' class='bzp-btn bzp-btn-ghost' style='color:var(--bzp-danger); border-color:var(--bzp-danger-soft); padding:0.5rem 1rem;'>Delete All</button>
          </div>
        </div>

        <table class='bzp-table'>
          <thead>
            <tr>
              <th style='width:40px; padding-left:1.5rem; text-align:left;'>
                <input type='checkbox' :checked='isAllSelected()' @click='toggleSelectAll()' style='width:16px; height:16px; cursor:pointer;'>
              </th>
              <th>Tenant</th>
              <th>Slug</th>
              <th>Created</th>
              <th>Runs</th>
              <th>Cost</th>
              <th>Limit</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <template x-for='t in filteredTenants()' :key='t.id'>
              <tr>
                <td style='padding-left:1.5rem;'>
                  <input type='checkbox' :value='t.id' x-model='selectedTenantIds' style='width:16px; height:16px; cursor:pointer;'>
                </td>
                <td>
                  <div style='font-weight:500;' x-text='t.name'></div>
                  <div style='display:flex; gap:0.3rem; align-items:center; margin-top:0.2rem;'>
                    <code style='font-size:0.7rem; color:var(--bzp-ink-faint); user-select:all;' x-text='t.api_key.slice(0,16)+"..."'></code>
                    <button @click='copyKey(t)' class='bzp-btn bzp-btn-ghost' style='padding:0.1rem 0.4rem; font-size:0.7rem;'>📋</button>
                  </div>
                </td>
                <td x-text='t.slug' style='font-family:monospace;'></td>
                <td x-text='fmtDate(t.created_at)'></td>
                <td x-text='t.runs_today + " / " + t.runs_total'></td>
                <td x-text="'\$' + (t.total_cost_usd || 0).toFixed(4)"></td>
                <td><input type='number' :value='t.daily_limit_override ?? ""' :placeholder="'(' + t.effective_daily_limit + ')'" @change='patchLimit(t, $event.target.value)' class='bzp-input' style='width:70px;'></td>
                <td><span class='bzp-pill' :class='t.suspended ? "bzp-pill-danger" : "bzp-pill-success"' x-text='t.suspended ? "suspended" : "active"'></span></td>
                <td style='text-align:right; white-space:nowrap;'>
                  <button @click='openEditModal(t)' class='bzp-btn bzp-btn-ghost' style='padding: 0.4rem 0.8rem;'>Edit</button>
                  <button @click='toggleSuspend(t)' class='bzp-btn bzp-btn-ghost' style='padding: 0.4rem 0.8rem;' x-text='t.suspended ? "Activate" : "Suspend"'></button>
                  <button @click='impersonate(t)' class='bzp-btn bzp-btn-primary' style='padding: 0.4rem 0.8rem;'>Sign in</button>
                  <button @click='deleteOne(t)' class='bzp-btn bzp-btn-ghost' style='color:var(--bzp-danger); border-color:transparent; padding: 0.4rem 0.8rem;'>Delete</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- EDIT TENANT MODAL -->
      <div x-show='editingTenant' class='bzp-modal-overlay' style='display:none;' x-transition>
        <div class='bzp-modal' @click.away='closeEditModal()'>
          <h3 style='margin-bottom:1.5rem;'>Edit Tenant Details</h3>
          <template x-if='editingTenant'>
            <form @submit.prevent='saveEditModal()'>
              <div style='margin-bottom:1.25rem;'>
                <label class='bzp-label' for='editName'>Tenant Name</label>
                <input id='editName' x-model='editingTenant.name' type='text' class='bzp-input' required>
              </div>
              
              <div style='margin-bottom:1.25rem;'>
                <label class='bzp-label' for='editLimit'>Daily Limit Override</label>
                <input id='editLimit' x-model='editingTenant.daily_limit_override' type='number' placeholder='Defaults to system limit' class='bzp-input'>
                <span style='font-size:0.75rem; color:var(--bzp-ink-faint);'>Leave empty to use the system default daily limit.</span>
              </div>

              <div style='margin-bottom:1.25rem;'>
                <label class='bzp-label' for='editNotes'>Notes</label>
                <textarea id='editNotes' x-model='editingTenant.notes' class='bzp-textarea' rows='4' placeholder='Operator notes...'></textarea>
              </div>

              <div style='margin-bottom:1.25rem; display:flex; align-items:center; gap:0.5rem;'>
                <input id='editSuspended' type='checkbox' x-model='editingTenant.suspended' style='width:18px; height:18px; cursor:pointer;'>
                <label class='bzp-label' for='editSuspended' style='margin:0; cursor:pointer;'>Suspend this tenant (blocks all runs/api requests)</label>
              </div>

              <div style='margin-bottom:1.5rem; display:flex; align-items:center; gap:0.5rem;'>
                <input id='editIsTest' type='checkbox' x-model='editingTenant.is_test' style='width:18px; height:18px; cursor:pointer;'>
                <label class='bzp-label' for='editIsTest' style='margin:0; cursor:pointer;'>Mark as test tenant (development testing)</label>
              </div>

              <div style='display:flex; justify-content:flex-end; gap:0.75rem; border-top:1px solid var(--bzp-border); padding-top:1.25rem;'>
                <button type='button' @click='closeEditModal()' class='bzp-btn bzp-btn-ghost'>Cancel</button>
                <button type='submit' class='bzp-btn bzp-btn-primary'>Save Changes</button>
              </div>
            </form>
          </template>
        </div>
      </div>

      <!-- BULK EDIT TENANT MODAL -->
      <div x-show='bulkEditingTenants' class='bzp-modal-overlay' style='display:none;' x-transition>
        <div class='bzp-modal' @click.away='closeBulkEditModal()'>
          <template x-if='bulkEditingTenants'>
            <div>
              <h3 style='margin-bottom:1.5rem;' x-text="'Bulk Edit Tenants (' + bulkEditingTenants.targetIds.length + ' selected)'">Bulk Edit Tenants</h3>
              <form @submit.prevent='saveBulkEditModal()'>
                
                <!-- Daily Limit Override -->
                <div style='margin-bottom:1.25rem; border:1px solid var(--bzp-border); padding:0.75rem; border-radius:var(--bzp-radius);'>
                  <div style='display:flex; align-items:center; gap:0.5rem; margin-bottom:0.5rem;'>
                    <input id='bulkUpdateLimitCheckbox' type='checkbox' x-model='bulkEditingTenants.updateLimit' style='width:16px; height:16px; cursor:pointer;'>
                    <label class='bzp-label' for='bulkUpdateLimitCheckbox' style='margin:0; cursor:pointer; font-weight:600;'>Update Daily Limit Override</label>
                  </div>
                  <div x-show='bulkEditingTenants.updateLimit' style='margin-top:0.5rem; padding-left:1.5rem;'>
                    <label class='bzp-label' for='bulkLimit'>New Limit Override</label>
                    <input id='bulkLimit' x-model='bulkEditingTenants.daily_limit_override' type='number' placeholder='Defaults to system limit' class='bzp-input'>
                    <div style='margin-top:0.5rem; display:flex; align-items:center; gap:0.5rem;'>
                      <input id='bulkClearLimit' type='checkbox' x-model='bulkEditingTenants.clear_daily_limit_override' style='width:16px; height:16px; cursor:pointer;'>
                      <label class='bzp-label' for='bulkClearLimit' style='margin:0; cursor:pointer; font-size:0.8rem; color:var(--bzp-ink-soft);'>Clear limit override (revert to system default)</label>
                    </div>
                  </div>
                </div>

                <!-- Suspended -->
                <div style='margin-bottom:1.25rem; border:1px solid var(--bzp-border); padding:0.75rem; border-radius:var(--bzp-radius);'>
                  <div style='display:flex; align-items:center; gap:0.5rem; margin-bottom:0.5rem;'>
                    <input id='bulkUpdateSuspendedCheckbox' type='checkbox' x-model='bulkEditingTenants.updateSuspended' style='width:16px; height:16px; cursor:pointer;'>
                    <label class='bzp-label' for='bulkUpdateSuspendedCheckbox' style='margin:0; cursor:pointer; font-weight:600;'>Update Suspension Status</label>
                  </div>
                  <div x-show='bulkEditingTenants.updateSuspended' style='margin-top:0.5rem; padding-left:1.5rem; display:flex; gap:1.5rem;'>
                    <label style='display:flex; align-items:center; gap:0.3rem; cursor:pointer; font-size:0.9rem;'>
                      <input type='radio' name='bulkSuspended' :value='true' x-model='bulkEditingTenants.suspended' style='cursor:pointer;'> Suspend
                    </label>
                    <label style='display:flex; align-items:center; gap:0.3rem; cursor:pointer; font-size:0.9rem;'>
                      <input type='radio' name='bulkSuspended' :value='false' x-model='bulkEditingTenants.suspended' style='cursor:pointer;'> Activate
                    </label>
                  </div>
                </div>

                <!-- Is Test -->
                <div style='margin-bottom:1.25rem; border:1px solid var(--bzp-border); padding:0.75rem; border-radius:var(--bzp-radius);'>
                  <div style='display:flex; align-items:center; gap:0.5rem; margin-bottom:0.5rem;'>
                    <input id='bulkUpdateIsTestCheckbox' type='checkbox' x-model='bulkEditingTenants.updateIsTest' style='width:16px; height:16px; cursor:pointer;'>
                    <label class='bzp-label' for='bulkUpdateIsTestCheckbox' style='margin:0; cursor:pointer; font-weight:600;'>Update Test Status</label>
                  </div>
                  <div x-show='bulkEditingTenants.updateIsTest' style='margin-top:0.5rem; padding-left:1.5rem; display:flex; gap:1.5rem;'>
                    <label style='display:flex; align-items:center; gap:0.3rem; cursor:pointer; font-size:0.9rem;'>
                      <input type='radio' name='bulkIsTest' :value='true' x-model='bulkEditingTenants.is_test' style='cursor:pointer;'> Mark as Test
                    </label>
                    <label style='display:flex; align-items:center; gap:0.3rem; cursor:pointer; font-size:0.9rem;'>
                      <input type='radio' name='bulkIsTest' :value='false' x-model='bulkEditingTenants.is_test' style='cursor:pointer;'> Mark as Actual
                    </label>
                  </div>
                </div>

                <!-- Notes -->
                <div style='margin-bottom:1.25rem; border:1px solid var(--bzp-border); padding:0.75rem; border-radius:var(--bzp-radius);'>
                  <div style='display:flex; align-items:center; gap:0.5rem; margin-bottom:0.5rem;'>
                    <input id='bulkUpdateNotesCheckbox' type='checkbox' x-model='bulkEditingTenants.updateNotes' style='width:16px; height:16px; cursor:pointer;'>
                    <label class='bzp-label' for='bulkUpdateNotesCheckbox' style='margin:0; cursor:pointer; font-weight:600;'>Update Notes</label>
                  </div>
                  <div x-show='bulkEditingTenants.updateNotes' style='margin-top:0.5rem; padding-left:1.5rem;'>
                    <textarea id='bulkNotes' x-model='bulkEditingTenants.notes' class='bzp-textarea' rows='3' placeholder='Bulk notes...'></textarea>
                  </div>
                </div>

                <div style='display:flex; justify-content:flex-end; gap:0.75rem; border-top:1px solid var(--bzp-border); padding-top:1.25rem;'>
                  <button type='button' @click='closeBulkEditModal()' class='bzp-btn bzp-btn-ghost'>Cancel</button>
                  <button type='submit' class='bzp-btn bzp-btn-primary'>Apply Bulk Changes</button>
                </div>
              </form>
            </div>
          </template>
        </div>
      </div>

      <!-- RESOURCES tab -->
      <div x-show="activeTab === 'resources'">
        <div class='bzp-card'>
          <h3>Server Disk Usage</h3>
          <div class='bzp-grid-stats' style='margin-top:1rem;'>
            <template x-for='d in diskUsage' :key='d.mount'>
              <div class='bzp-stat'>
                <div class='bzp-stat-label' x-text='d.mount'></div>
                <div style='display:flex; align-items:baseline; gap:0.5rem;'>
                  <div class='bzp-stat-value' x-text='d.percent + "%"'></div>
                  <div style='font-size:0.85rem; color:var(--bzp-ink-faint);' x-text='d.used + " / " + d.total'></div>
                </div>
                <div style='height:4px; background:var(--bzp-border-faint); border-radius:2px; margin-top:0.5rem; overflow:hidden;'>
                  <div :style='`width: ${d.percent}%; background: ${d.percent > 90 ? "var(--bzp-danger)" : "var(--bzp-accent)"}; height:100%;`'></div>
                </div>
              </div>
            </template>
          </div>
        </div>

        <div class='bzp-card' style='margin-top:1.5rem;'>
          <h3 style='color:var(--bzp-danger);'>GPU Status (Engine Bottleneck)</h3>
          <p style='font-size:0.95rem; color:var(--bzp-ink-soft); margin-top:0.5rem;'>
            Background engines (VLLM, TEI) are <strong>OFFLINE</strong> because the server's GPUs are currently occupied by other processes.
          </p>
          <div class='bzp-grid-stats' style='margin-top:1rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));'>
            <template x-for='g in gpuUsage' :key='g.index'>
              <div class='bzp-stat' style='padding:0.8rem; display:block; min-height:auto;'>
                <div style='display:flex; justify-content:space-between; align-items:baseline;'>
                  <div class='bzp-stat-label' style='font-size:0.75rem;' x-text="'GPU ' + g.index + ': ' + g.name"></div>
                  <div class='bzp-stat-value' style='font-size:1.1rem;' x-text='g.util + "%"'></div>
                </div>
                <div style='font-size:0.7rem; color:var(--bzp-ink-faint); margin-bottom:0.4rem;' x-text='g.used + " / " + g.total'></div>
                <div style='height:3px; background:var(--bzp-border-faint); margin-bottom:0.8rem;'>
                  <div :style='`width: ${g.util}%; background: ${g.util > 80 ? "var(--bzp-danger)" : "var(--bzp-success)"}; height:100%;`'></div>
                </div>
                
                <div x-show='g.processes?.length'>
                  <div style='font-size:0.65rem; font-weight:600; text-transform:uppercase; color:var(--bzp-ink-faint); border-bottom:1px solid var(--bzp-border-faint); padding-bottom:0.2rem; margin-bottom:0.3rem;'>Active Processes</div>
                  <template x-for='p in g.processes' :key='p.pid'>
                    <div style='display:flex; justify-content:space-between; align-items:center; font-size:0.75rem; font-family:var(--bzp-font-mono); margin-bottom:0.2rem;'>
                      <div style='display:flex; align-items:center; gap:0.4rem;'>
                        <button @click='terminateProcess(p.pid)' class='bzp-btn bzp-btn-ghost' style='padding:0 0.2rem; height:18px; line-height:1; font-size:0.7rem; color:var(--bzp-danger); min-width:auto;' title='Terminate Process'>✕</button>
                        <span style='color:var(--bzp-ink-soft);' x-text='p.user + " (" + p.pid + ")"'></span>
                      </div>
                      <span x-text='p.mem'></span>
                    </div>
                  </template>
                </div>
                <div x-show='!g.processes?.length' style='font-size:0.75rem; color:var(--bzp-ink-faint); font-style:italic;'>No active compute apps</div>
              </div>
            </template>
          </div>
          <div style='margin-top:1rem; padding:0.8rem; background:var(--bzp-cream); border-radius:4px; border:1px solid var(--bzp-border); font-size:0.85rem; color:var(--bzp-ink-soft);'>
            <strong>Operator Action Required:</strong> To start engines, find a GPU with &lt;10% utilization and &gt;20GB free memory, then run <code>CUDA_VISIBLE_DEVICES=N bash scripts/run_vllm.sh</code> in the tmux session.
          </div>
        </div>

        <div class='bzp-card' style='margin-top:1.5rem;'>
          <h3>Top GPU Consumers (Aggregated)</h3>
          <p style='font-size:0.9rem; color:var(--bzp-ink-soft); margin-bottom:1rem;'>Total GPU memory used by each operator across all cards.</p>
          <table class='bzp-table'>
            <thead><tr><th>Operator</th><th>Total GPU Memory</th></tr></thead>
            <tbody>
              <template x-for='u in topGpuUsers' :key='u.user'>
                <tr>
                  <td><strong x-text='u.user'></strong></td>
                  <td x-text='u.mem'></td>
                </tr>
              </template>
            </tbody>
          </table>
          <div x-show='!topGpuUsers.length' style='padding:1rem; text-align:center; color:var(--bzp-ink-faint); font-style:italic;'>No active GPU processes detected.</div>
        </div>

        <div class='bzp-card' style='margin-top:1.5rem;'>
          <h3>Maintenance Guide</h3>
          <div style='line-height:1.6; color:var(--bzp-ink-soft); font-size:0.95rem;'>
            <p>If the <strong>/raid</strong> partition is above 90%, AI analysis may fail. Follow these steps via SSH to reclaim space:</p>
            
            <h4 style='margin:1.5rem 0 0.5rem; color:var(--bzp-ink);'>1. Clear System Logs</h4>
            <code class='bzp-code' style='display:block; padding:0.8rem;'>rm logs/*.log</code>
            <p style='font-size:0.85rem; margin-top:0.4rem;'>Safely deletes API, Qdrant, and Engine logs. These grow over time.</p>

            <h4 style='margin:1.5rem 0 0.5rem; color:var(--bzp-ink);'>2. Prune HuggingFace Cache</h4>
            <code class='bzp-code' style='display:block; padding:0.8rem;'>rm -rf .cache/huggingface/*</code>
            <p style='font-size:0.85rem; margin-top:0.4rem;'>Deletes downloaded AI models. They will be re-downloaded automatically when needed.</p>

            <h4 style='margin:1.5rem 0 0.5rem; color:var(--bzp-ink);'>3. Clean Temporary Files</h4>
            <code class='bzp-code' style='display:block; padding:0.8rem;'>rm -rf /tmp/bizpulse-*</code>
            <p style='font-size:0.85rem; margin-top:0.4rem;'>Clears transient data from previous analysis runs.</p>
          </div>
        </div>
      </div>

      <!-- METADATA tab -->
      <div x-show="activeTab === 'metadata'">
         <div class='bzp-card'>
            <h3>Industries</h3>
            <button @click='addIndustry()' class='bzp-btn bzp-btn-primary' style='margin-bottom:1rem;'>Add Industry +</button>
            <table class='bzp-table'>
              <thead><tr><th>Slug</th><th>Name</th><th></th></tr></thead>
              <tbody>
                <template x-for='p in industries' :key='p.slug'>
                  <tr>
                    <td x-text='p.slug' style='font-family:monospace;'></td>
                    <td x-text='p.name'></td>
                    <td style='text-align:right;'><button @click='deleteIndustry(p)' class='bzp-btn bzp-btn-ghost' style='color:var(--bzp-danger);'>Delete</button></td>
                  </tr>
                </template>
              </tbody>
            </table>
         </div>
         <div class='bzp-card' style='margin-top:1.5rem;'>
            <h3>Locations</h3>
            <div style='display:flex; gap:1rem; margin-bottom:1rem;'>
              <button @click='addCountry()' class='bzp-btn bzp-btn-primary'>Add Country +</button>
              <button @click='addState()' class='bzp-btn bzp-btn-primary'>Add State +</button>
            </div>
            <h4>Countries</h4>
            <div style='display:flex; flex-wrap:wrap; gap:0.5rem;'>
              <template x-for='c in locations.countries' :key='c.code'>
                <span class='bzp-pill bzp-pill-neutral' x-text='c.code + ": " + c.name'></span>
              </template>
            </div>
            <h4 style='margin-top:1.5rem;'>States</h4>
            <template x-for='(states, country) in locations.states' :key='country'>
               <div style='margin-bottom:0.5rem;'>
                 <strong x-text='country'></strong>: 
                 <template x-for='s in states' :key='s.code'>
                   <span class='bzp-pill bzp-pill-accent' style='margin-right:0.3rem;' x-text='s.name'></span>
                 </template>
               </div>
            </template>
         </div>
      </div>

      <!-- AUDIT tab -->
      <div x-show="activeTab === 'audit'" class='bzp-card'>
        <button @click='loadAudit()' class='bzp-btn bzp-btn-primary'>Load audit log</button>
        <table class='bzp-table' style='margin-top:1rem;'>
          <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Target</th></tr></thead>
          <tbody>
            <template x-for='e in audit' :key='e.id'>
              <tr><td x-text='fmtTime(e.occurred_at)'></td><td x-text='e.actor'></td><td x-text='e.action'></td><td x-text='e.target_kind + ": " + e.target_id'></td></tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- CLEANUP tab -->
      <div x-show="activeTab === 'cleanup'" class='bzp-card'>
        <input x-model='cleanupPattern' class='bzp-input' placeholder='Regex pattern...'>
        <button @click='dryRunCleanup()' class='bzp-btn bzp-btn-ghost'>Preview</button>
        <button @click='confirmAndCleanup()' class='bzp-btn bzp-btn-primary'>Delete</button>
      </div>

      <div style='text-align:right; margin-top:1rem;'>
        <button @click='load()' class='bzp-btn bzp-btn-ghost'>↻ Refresh</button>
      </div>
    </div>
  </template>
</div>
</body>
</html>
