[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bizpulse"
version = "0.1.0"
description = "Multi-agent RAG platform that turns a business URL into a grounded, cited marketing strategy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amit", email = "batsh.amit@gmail.com" }]

dependencies = [
    # Core
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "tenacity>=9.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",

    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",

    # Data layer
    "qdrant-client>=1.12",
    "psycopg[binary]>=3.2",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",

    # LLM clients (vLLM is OpenAI-compatible)
    "openai>=1.50",
    "anthropic>=0.40",

    # Agents & orchestration
    "langgraph>=0.2.50",
    "langchain-core>=0.3",

    # Ingestion
    "playwright>=1.48",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "trafilatura>=1.12",

    # MCP
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "types-PyYAML",
]
eval = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.scripts]
bizpulse = "bizpulse.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by black

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/bizpulse"]
branch = true
